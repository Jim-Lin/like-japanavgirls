[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.13.3", features = ["behavior-version-latest"] }
aws-sdk-rekognition = "1.126.0"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = "0.4.45"
futures-util = "0.3.34"
mongodb = "3.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
# Drop symbols/debuginfo from release binaries (much smaller; backtraces lose function names).
strip = true
